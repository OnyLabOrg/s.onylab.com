<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirect…</title>
  <meta http-equiv="refresh" content="0; url=https://onylab.com/">
  <link rel="canonical" href="https://onylab.com/">
  <meta name="robots" content="noindex">
  <script>
    location.replace("https://onylab.com" + location.pathname + location.search + location.hash);
  </script>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #222; --link: #0057d9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121417; --fg: #e6e6e6; --link: #6aa8ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--fg); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <p>Redirect to <a href="https://onylab.com/">onylab.com</a>…</p>
</body>
</html>
